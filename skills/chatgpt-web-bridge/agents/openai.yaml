interface:
  display_name: "ChatGPT 网页桥"
  short_description: "让 ChatGPT 网页版当大脑：本地只做传输与执行，conversation_id 专线续接。"
  default_prompt: "使用 $chatgpt-web-bridge：推进网页端会话时先消费当前返回、客户端暴露的 overflow/out_file 和 delivery receipt；只有没有进行中的生成时才发最小提示（如「继续」）让网页端自己思考。timeout/cancel 不证明未送达，tail 为 in_progress 时只读等待，绝不催促；指挥循环时忠实执行网页端指令并把事实回帖到同一 conversation_id。不替它写执行步骤；对等模式仅在用户明确要求时启用，使用新鲜上下文和材料边界，盲答先行、分歧到顶出报告。"
