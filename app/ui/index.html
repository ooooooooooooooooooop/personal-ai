<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="side-top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><circle cx="19" cy="18" r="2"/></svg>
        Personal AI
      </div>
    </div>

    <nav class="side-nav">
      <button class="nav-item active" data-view="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>
        对话
      </button>
      <button class="nav-item" data-view="bodies">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        身体
      </button>
      <button class="nav-item" data-view="jobs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        任务
      </button>
      <button class="nav-item" data-view="audit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l4 4v14H8z"/><path d="M11 8h5M11 12h5M11 16h3"/></svg>
        审计
      </button>
    </nav>

    <div class="side-section">当前身体</div>
    <div id="side-body"></div>

    <div class="side-spacer"></div>
    <div class="side-foot">
      <span id="status-dot" class="dot"></span>
      <span id="status">连接中…</span>
    </div>
  </aside>

  <main>
    <div class="topbar drag">
      <span id="view-title">新建任务</span>
      <span class="spacer"></span>
      <button id="body-chip" class="chip no-drag" title="选择身体"></button>
    </div>

    <div id="switch-progress"><span></span></div>

    <section id="view-chat" class="view">
      <div id="transcript">
        <div id="empty-state">
          <svg class="mascot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><circle cx="19" cy="18" r="2"/></svg>
          <div class="empty-title">今天想做点什么？</div>
          <div class="empty-sub">输入一条消息，由当前身体执行。治理、审计与持久化在底下照常运转。</div>
        </div>
      </div>

      <div id="composer-dock">
        <div id="composer">
          <textarea id="input" rows="1" placeholder="分配任务，或询问任何问题…"></textarea>
          <div class="composer-bar">
            <button id="steer" class="ghost-btn" title="运行中追加指示" disabled>插话</button>
            <span class="spacer"></span>
            <span id="model-chip" class="chip dim"></span>
            <button id="abort" class="icon-btn danger hidden" title="中止">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
            <button id="send" class="send-btn" title="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="view-bodies" class="view hidden">
      <div class="page-head">
        <h1>身体</h1>
        <p class="page-sub">谁在驾驶由你决定。能力事实实测登记；不满足必要不变量的身体会被 fail-closed 拒绝执行。</p>
      </div>
      <div id="body-grid"></div>
    </section>

    <section id="view-jobs" class="view hidden">
      <div class="page-head">
        <h1>任务</h1>
        <p class="page-sub">持久化任务——跨重启、跨身体存活。</p>
      </div>
      <div class="table-wrap">
        <table id="jobs"><thead><tr><th>job</th><th>类型</th><th>状态</th><th>更新时间</th></tr></thead><tbody></tbody></table>
      </div>
    </section>

    <section id="view-audit" class="view hidden">
      <div class="page-head">
        <h1>审计</h1>
        <p class="page-sub">治理与运行时事件流——谁在何时做了什么决定。</p>
      </div>
      <div id="audit-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
